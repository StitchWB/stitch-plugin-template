name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . --extend-exclude "_vendor"
      - name: Validate manifest
        run: |
          python - <<'EOF'
          import json, sys
          with open("plugin.json", encoding="utf-8") as f:
              m = json.load(f)
          required = ["schema", "id", "name", "version", "kind", "entry"]
          missing = [k for k in required if k not in m]
          if missing:
              sys.exit(f"plugin.json missing fields: {missing}")
          if m["kind"] != "service":
              sys.exit(f"expected kind=service, got {m['kind']!r}")
          if not m["entry"].get("module"):
              sys.exit("entry.module is required")
          print(f"manifest OK: {m['id']}@{m['version']}")
          EOF
      - name: Classify
        run: |
          python - <<'EOF'
          import json, sys
          with open("plugin.json", encoding="utf-8") as f:
              m = json.load(f)
          # hub classify needs hub-only zone rules; the public CI asserts the lane
          if m["kind"] == "service":
              print(json.dumps({"class": "open-core", "channel": "public"}))
          else:
              sys.exit(f"kind={m['kind']!r} is not the public service lane - use the hub")
          EOF
      - name: Run plugin tests
        run: python -m pytest tests/ -q --timeout=60
